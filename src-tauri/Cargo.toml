[package]
name = "stream-persona-overlay"
version = "0.8.0"
description = "Stream Persona Overlay — Tauri v2 app for Twitch/TikTok persona display"
authors = ["SummerTYT <vicentefelipechile>"]
edition = "2021"

[lib]
name = "stream_persona_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Discord bot
serenity = { version = "0.12", default-features = false, features = [
    "client", "gateway", "rustls_backend", "model", "cache"
] }
poise = "0.6"

# Twitch IRC
twitch-irc = { version = "5", features = ["transport-tcp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# TikTok (WebSocket nativo)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Base de datos
rusqlite = { version = "0.31", features = ["bundled"] }

# Imágenes
image = "0.25"

# TTS
tts = "0.26"

# Native microphone capture (streamer persona mouth sync) — runs in the backend
# so the OBS overlay never has to request browser mic permissions.
cpal = "0.15"

# Utils
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
async-trait = "0.1"

# HTTP + WebSocket server (OBS Browser Source)
axum = { version = "0.7", features = ["ws"] }
# Embed dist/ assets into the release binary so no external dist/ folder is needed
rust-embed = "8"
