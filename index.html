<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stream Persona Overlay — Panel de administración para gestionar personas de chat en tiempo real" />
    <title>Stream Persona — Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/entry-panel.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo-mark">
          <span class="logo-icon">◈</span>
          <div class="logo-text">
            <span class="logo-title">Stream Persona</span>
            <span class="logo-version">v0.1.1</span>
          </div>
        </div>
      </div>

      <ul class="nav-links" role="navigation" aria-label="Menú principal">
        <li>
          <a href="#/twitch" id="nav-twitch" class="nav-link" data-view="twitch">
            <span class="nav-icon" data-icon="twitch"></span>
            <span>Twitch</span>
          </a>
        </li>
        <li>
          <a href="#/tiktok" id="nav-tiktok" class="nav-link" data-view="tiktok">
            <span class="nav-icon" data-icon="tiktok"></span>
            <span>TikTok</span>
          </a>
        </li>
        <li>
          <a href="#/config" id="nav-config" class="nav-link active" data-view="config">
            <span class="nav-icon" data-icon="config"></span>
            <span>Configuración</span>
          </a>
        </li>
        <li>
          <a href="#/users" id="nav-users" class="nav-link" data-view="users">
            <span class="nav-icon" data-icon="users"></span>
            <span>Usuarios</span>
          </a>
        </li>
        <li>
          <a href="#/logs" id="nav-logs" class="nav-link" data-view="logs">
            <span class="nav-icon" data-icon="logs"></span>
            <span>Logs</span>
          </a>
        </li>
        <li>
          <a href="#/tamagotchi" id="nav-tamagotchi" class="nav-link" data-view="tamagotchi">
            <span class="nav-icon" data-icon="tamagotchi"></span>
            <span>Tamagotchi</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div id="connection-status" class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">Desconectado</span>
        </div>
        <button id="btn-toggle-overlay" class="btn btn-outline btn-sm">
          Mostrar Overlay
        </button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content" role="main">
      <div id="view-container">
        <!-- Views se renderizan aquí por el router -->
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Cargando...</p>
        </div>
      </div>
    </main>
  </body>
</html>
