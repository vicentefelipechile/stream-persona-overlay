<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stream Persona Overlay — Panel de administración para gestionar personas de chat en tiempo real" />
    <title>Stream Persona — Panel</title>
    <!-- Critical inline background so the first paint is the app's dark theme,
         not the webview's default white, before entry-panel.css loads. -->
    <!-- The splash styles are inlined here too so the logo paints on the very
         first frame, before entry-panel.css has loaded. main.ts removes the
         splash (fading it out) once the panel has finished its initial load. -->
    <style>
      html, body { background: #0d0f14; }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Degradado sutil (no negro plano) para que el splash se distinga del
           backgroundColor #0d0f14 de la ventana Tauri en cuanto la webview pinta. */
        background: radial-gradient(circle at 50% 42%, #1a2030 0%, #0d0f14 70%);
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #app-splash .splash-logo {
        width: 112px;
        height: 112px;
        image-rendering: auto;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      #app-splash .splash-title {
        font-family: system-ui, sans-serif;
        font-size: 15px;
        letter-spacing: 0.04em;
        color: #7a8099;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-logo { animation: none; }
      }
    </style>
    <link rel="stylesheet" href="/src/styles/entry-panel.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- Splash screen — shown until the panel finishes its initial load, then
         faded out and removed by main.ts. The logo (src/assets/app-logo.png) is
         rewritten by Vite to a hashed/bundled URL. -->
    <div id="app-splash">
      <div class="splash-inner">
        <img class="splash-logo" src="/src/assets/app-logo.png" alt="Stream Persona Overlay" />
        <span class="splash-title">Stream Persona Overlay</span>
      </div>
    </div>

    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo-mark">
          <span class="logo-icon">◈</span>
          <div class="logo-text">
            <span class="logo-title">Stream Persona</span>
            <span class="logo-version">v0.12.0</span>
          </div>
        </div>
      </div>

      <ul class="nav-links" role="navigation" aria-label="Menú principal">
        <li>
          <a href="#/twitch" id="nav-twitch" class="nav-link" data-view="twitch">
            <span class="nav-icon" data-icon="twitch"></span>
            <span>Twitch</span>
          </a>
        </li>
        <li>
          <a href="#/tiktok" id="nav-tiktok" class="nav-link" data-view="tiktok">
            <span class="nav-icon" data-icon="tiktok"></span>
            <span>TikTok</span>
          </a>
        </li>
        <li>
          <a href="#/eventos" id="nav-eventos" class="nav-link" data-view="eventos">
            <span class="nav-icon" data-icon="eventos"></span>
            <span>Eventos</span>
          </a>
        </li>
        <li>
          <a href="#/config" id="nav-config" class="nav-link active" data-view="config">
            <span class="nav-icon" data-icon="config"></span>
            <span>Configuración</span>
          </a>
        </li>
        <li>
          <a href="#/users" id="nav-users" class="nav-link" data-view="users">
            <span class="nav-icon" data-icon="users"></span>
            <span>Usuarios</span>
          </a>
        </li>
        <li>
          <a href="#/logs" id="nav-logs" class="nav-link" data-view="logs">
            <span class="nav-icon" data-icon="logs"></span>
            <span>Logs</span>
          </a>
        </li>
        <li>
          <a href="#/tamagotchi" id="nav-tamagotchi" class="nav-link" data-view="tamagotchi">
            <span class="nav-icon" data-icon="tamagotchi"></span>
            <span>Tamagotchi</span>
          </a>
        </li>
        <li>
          <a href="#/streamer" id="nav-streamer" class="nav-link" data-view="streamer">
            <span class="nav-icon" data-icon="streamer"></span>
            <span>Streamer Persona</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div id="connection-status" class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">Desconectado</span>
        </div>
        <button id="btn-toggle-overlay" class="btn btn-outline btn-sm">
          Mostrar Overlay
        </button>
        <button id="btn-onboarding" class="btn btn-secondary btn-sm">
          <span class="btn-onboarding-icon"></span>
          <span>¿Cómo empezar?</span>
        </button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content" role="main">
      <div id="view-container">
        <!-- El router crea un pane persistente por vista aquí. -->
      </div>
    </main>
  </body>
</html>
