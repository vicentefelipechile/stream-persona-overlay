name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ─────────────────────────────────────────────
  # Build the raw binary on each target platform
  # ─────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: stream-persona-overlay.exe
            artifact_name: stream-persona-overlay-windows-x86_64.exe

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: stream-persona-overlay
            artifact_name: stream-persona-overlay-linux-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: stream-persona-overlay
            artifact_name: stream-persona-overlay-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Build binary (no installers)
        run: npm run tauri build -- --bundles none --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
             "${{ matrix.artifact_name }}"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            certutil -hashfile "${{ matrix.artifact_name }}" SHA256 \
              | grep -v "^SHA" | tr -d ' \r\n' \
              > "${{ matrix.artifact_name }}.sha256"
          else
            sha256sum "${{ matrix.artifact_name }}" | awk '{print $1}' \
              > "${{ matrix.artifact_name }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  # ─────────────────────────────────────────────
  # Create the GitHub Release and attach binaries
  # ─────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog from git log
        id: changelog
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            SINCE_MSG="*(first release — all commits)*"
          else
            RANGE="${PREV_TAG}..HEAD"
            SINCE_MSG="*Changes since \`${PREV_TAG}\`*"
          fi

          # Categorize by conventional-commit prefix
          FEAT=$(git log $RANGE --oneline --no-merges | grep -E "^[a-f0-9]+ feat" | sed 's/^[a-f0-9]* /- /')
          FIX=$(git log $RANGE  --oneline --no-merges | grep -E "^[a-f0-9]+ fix"  | sed 's/^[a-f0-9]* /- /')
          OTHER=$(git log $RANGE --oneline --no-merges | grep -vE "^[a-f0-9]+ (feat|fix|chore|docs|style|refactor|test|ci)" | sed 's/^[a-f0-9]* /- /')

          BODY=""
          [ -n "$FEAT"  ] && BODY="${BODY}\n### ✨ New features\n${FEAT}\n"
          [ -n "$FIX"   ] && BODY="${BODY}\n### 🐛 Bug fixes\n${FIX}\n"
          [ -n "$OTHER" ] && BODY="${BODY}\n### 🔧 Other changes\n${OTHER}\n"
          [ -z "$BODY"  ] && BODY="\n*No notable changes.*\n"

          {
            echo "CHANGELOG<<DELIM"
            echo -e "$SINCE_MSG\n$BODY"
            echo "DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Stream Persona Overlay ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            ## Stream Persona Overlay ${{ github.ref_name }}

            > Panel de overlays para Twitch y TikTok con sistema Tamagotchi, filtros de spam y fuente de navegador para OBS.

            ---

            ## 📥 ¿Qué archivo descargar?

            | Sistema | Archivo | Notas |
            |---------|---------|-------|
            | Windows 10/11 (64-bit) | `stream-persona-overlay-windows-x86_64.exe` | Ejecutar directamente, sin instalación |
            | Linux x86_64 | `stream-persona-overlay-linux-x86_64` | Dar permisos con `chmod +x` antes de ejecutar |
            | macOS (Apple Silicon) | `stream-persona-overlay-macos-arm64` | Puede requerir `xattr -cr` si macOS bloquea la ejecución |

            > **Verificar integridad:** cada binario incluye un archivo `.sha256` con su checksum.
            > ```
            > # Linux / macOS
            > sha256sum -c stream-persona-overlay-linux-x86_64.sha256
            > ```

            ---

            ## 🔄 Cambios en esta versión

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            ## ⚡ Inicio rápido

            1. Descarga el binario para tu sistema operativo.
            2. Abre la app — el panel principal aparecerá automáticamente.
            3. En OBS, añade una **Browser Source** apuntando a `http://localhost:6767/overlay`.
            4. Conecta tu cuenta de Twitch o TikTok desde el panel de configuración.

            ---

            *¿Encontraste un bug? Abre un [issue](../../issues/new) con los pasos para reproducirlo.*
          files: |
            artifacts/**
