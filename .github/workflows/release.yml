name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ─────────────────────────────────────────────
  # Build the raw binary on each target platform
  # ─────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: stream-persona-overlay.exe
            artifact_name: stream-persona-overlay-windows-x86_64.exe

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: stream-persona-overlay
            artifact_name: stream-persona-overlay-linux-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: stream-persona-overlay
            artifact_name: stream-persona-overlay-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libspeechd-dev \
            libasound2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build binary (no installers)
        run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
             "${{ matrix.artifact_name }}"

      - name: Generate SHA-256 checksum
        shell: bash
        run: sha256sum "${{ matrix.artifact_name }}" | awk '{print $1}' > "${{ matrix.artifact_name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  # ─────────────────────────────────────────────
  # Create the GitHub Release and attach binaries
  # ─────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -E '^v' | sed -n '2p')
          echo "tag=${PREV:-${{ github.ref_name }}}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            ## ¿Qué archivo descargar?

            | Sistema | Archivo | Notas |
            |---------|---------|-------|
            | Windows 10/11 (64-bit) | `stream-persona-overlay-windows-x86_64.exe` | Ejecutar directamente, sin instalación |
            | Linux x86_64 | `stream-persona-overlay-linux-x86_64` | Dar permisos con `chmod +x` antes de ejecutar |
            | macOS (Apple Silicon) | `stream-persona-overlay-macos-arm64` | Puede requerir `xattr -cr` si macOS bloquea la ejecución |

            **Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.tag }}...${{ github.ref_name }}
          files: |
            artifacts/**
